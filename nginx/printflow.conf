server {
    listen 80;
    server_name _;

    # PrintFlow (Node.js backend)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Spoolman direct (accessible aussi via /spoolman/)
    location /spoolman/ {
        proxy_pass http://127.0.0.1:7912/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-Frame-Options "ALLOWALL";
    }

    # Taille max upload (fichiers STL, 3MF, etc.)
    client_max_body_size 350M;

    # Logs
    access_log /var/log/nginx/printflow.access.log;
    error_log  /var/log/nginx/printflow.error.log;
}
