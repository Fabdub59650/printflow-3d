<!-- PRINTER INTERFACE MODAL -->
<div id="printer-iframe-modal" class="iframe-modal hidden">

    <span id="iframe-modal-title">Interface imprimante</span>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sm" id="iframe-open-tab">Ouvrir dans un onglet</button>
      <button class="btn btn-sm btn-close-modal" onclick="closePrinterIframe()">Fermer</button>
    </div>
  </div>
  <iframe id="printer-iframe" src="" allowfullscreen></iframe>
</div>

<div id="modal-overlay" class="hidden" onclick="closeModal()"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast-container"></div>

<script>
// Intercepteur d'erreurs global pour diagnostic
window.onerror = function(msg, src, line, col, err) {
  var div = document.getElementById('js-error-banner');
  if (!div) {
    div = document.createElement('div');
    div.id = 'js-error-banner';
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;z-index:99999;white-space:pre-wrap;max-height:200px;overflow-y:auto';
    document.body.appendChild(div);
  }
  div.textContent += (src ? src.split('/').pop() : '?') + ':' + line + ' — ' + msg + '\n';
  return false;
};
</script>
