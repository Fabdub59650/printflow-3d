         style="display:none;align-items:center;gap:7px;padding:10px 16px;
                border-top:0.5px solid var(--border);font-size:12px;
                color:var(--accent);cursor:pointer;transition:background 0.15s"

  <main id="main">
    <div id="topbar">
      <!-- Hamburger mobile/tablette -->
      <button id="hamburger-btn" style="display:none" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div id="page-title">Tableau de bord</div>
      <!-- Barre de recherche globale -->
      <div id="global-search-wrap" style="position:relative;flex:1;max-width:340px;margin:0 16px">
        <div style="display:flex;align-items:center;background:var(--bg3);border:0.5px solid var(--border2);
                    border-radius:var(--radius);padding:0 10px;gap:8px">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" style="color:var(--text3);flex-shrink:0">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input id="global-search-input" type="text" placeholder="Rechercher… (⌘K)"
            autocomplete="off" spellcheck="false"
            style="border:none;background:transparent;outline:none;font-size:13px;
                   color:var(--text);width:100%;padding:7px 0"
            oninput="onSearchInput(this.value)"
            onkeydown="onSearchKeydown(event)"
            onfocus="onSearchFocus()"
            onblur="onSearchBlur()">
          <kbd id="search-shortcut-hint"
            style="font-size:10px;color:var(--text3);background:var(--bg2);border:0.5px solid var(--border2);
                   border-radius:3px;padding:1px 5px;white-space:nowrap">⌘K</kbd>
          <button id="search-clear-btn" onclick="clearSearch()"
            style="display:none;border:none;background:none;cursor:pointer;color:var(--text3);
                   font-size:16px;line-height:1;padding:0">✕</button>
        </div>
        <div id="global-search-dropdown"
          style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;
                 background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);

        </div>
      </div>
      <div id="topbar-actions"></div>
      <!-- Toggle thème -->

<!-- ── Aide en ligne ── -->
<div id="help-overlay" onclick="closeHelp()"
  style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:300"></div>
<div id="help-drawer"

         background:var(--bg2);border-left:0.5px solid var(--border2);z-index:301;
         display:flex;flex-direction:column;transform:translateX(100%);
         transition:transform 0.25s ease;box-shadow:-8px 0 24px rgba(0,0,0,0.12)">
  <!-- Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;
              padding:16px 20px;border-bottom:0.5px solid var(--border2);flex-shrink:0">
    <div style="display:flex;align-items:center;gap:10px">
      <span style="font-size:18px">📖</span>
      <span style="font-size:15px;font-weight:600">Aide PrintFlow-3D</span>
    </div>
    <button onclick="closeHelp()"
      style="border:none;background:none;cursor:pointer;font-size:18px;color:var(--text3);
             width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center">✕</button>
  </div>
  <!-- Recherche -->
  <div style="padding:12px 20px;border-bottom:0.5px solid var(--border2);flex-shrink:0">
    <div style="display:flex;align-items:center;gap:8px;background:var(--bg3);
                border:0.5px solid var(--border2);border-radius:var(--radius);padding:0 10px">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" style="color:var(--text3);flex-shrink:0">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="help-search" type="text" placeholder="Rechercher dans l'aide…"
        autocomplete="off" oninput="onHelpSearch(this.value)"
        style="border:none;background:transparent;outline:none;font-size:13px;
               color:var(--text);width:100%;padding:8px 0">
    </div>
  </div>
  <!-- Navigation sections -->
  <div id="help-nav" style="padding:8px 12px;border-bottom:0.5px solid var(--border2);
       flex-shrink:0;display:flex;flex-wrap:wrap;gap:4px"></div>
  <!-- Contenu -->
  <div id="help-content" style="flex:1;overflow-y:auto;padding:20px"></div>
</div>

<script>
// Intercepteur d'erreurs global pour diagnostic
window.onerror = function(msg, src, line, col, err) {
  var div = document.getElementById('js-error-banner');
  if (!div) {
    div = document.createElement('div');
    div.id = 'js-error-banner';
    div.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px 16px;font-size:13px;font-family:monospace;z-index:99999;white-space:pre-wrap;max-height:200px;overflow-y:auto';
    document.body.appendChild(div);
  }
  div.textContent += (src ? src.split('/').pop() : '?') + ':' + line + ' — ' + msg + '\n';
  return false;
};
</script>

  <script>
  // ── Service Worker ────────────────────────────────────────
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(reg) { console.log('[PWA] SW enregistré', reg.scope); })
        .catch(function(e)  { console.warn('[PWA] SW erreur', e); });
    });
  }

  // ── Bouton d'installation PWA ─────────────────────────────
  let _pwaInstallPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    _pwaInstallPrompt = e;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'flex';
  });

  window.addEventListener('appinstalled', function() {
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.style.display = 'none';
    _pwaInstallPrompt = null;
  });

  function installPWA() {
    if (!_pwaInstallPrompt) return;
    _pwaInstallPrompt.prompt();
    _pwaInstallPrompt.userChoice.then(function(result) {
      _pwaInstallPrompt = null;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
    });
  }
  </script>
