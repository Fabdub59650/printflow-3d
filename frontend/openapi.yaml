openapi: 3.0.3
info:
  title: PrintFlow 3D API
  description: |
    API REST de PrintFlow — Gestion d'impressions 3D et filaments.

    ## Authentification
    Si l'authentification est activée dans les paramètres, ajoutez le header :
    ```
    X-Auth-Token: votre_mot_de_passe
    ```

    ## Intégration Home Assistant
    Exemple de sensor REST pour le stock de filaments :
    ```yaml
    sensor:
      - platform: rest
        name: PrintFlow stock faible
        resource: http://192.168.1.145/api/stats/alerts
        method: GET
        value_template: "{{ value_json | length }}"
        unit_of_measurement: "bobines"
    ```

  version: "1.7.0"
  contact:
    name: PrintFlow 3D
    url: https://github.com/Fabdub59650/printflow-3d

servers:
  - url: /api
    description: Serveur local (Raspberry Pi)

tags:
  - name: Filaments
    description: Gestion du stock de filaments
  - name: Impressions
    description: Suivi des impressions 3D
  - name: Imprimantes
    description: Gestion du parc d'imprimantes
  - name: Projets
    description: Organisation par projets
  - name: Maintenance
    description: Suivi de la maintenance
  - name: Bibliothèque
    description: Bibliothèque d'objets 3D
  - name: Statistiques
    description: Statistiques et alertes
  - name: Historique
    description: Journal des modifications
  - name: NFC
    description: Gestion des puces NFC
  - name: Paramètres
    description: Configuration de l'application

paths:

  # ── FILAMENTS ─────────────────────────────────────────────

  /filaments:
    get:
      tags: [Filaments]
      summary: Lister les filaments
      parameters:
        - name: archived
          in: query
          description: "1 pour inclure les bobines archivées"
          schema:
            type: integer
            enum: [0, 1]
      responses:
        "200":
          description: Liste des filaments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Filament'
              example:
                - id: 1
                  name: "PLA Blanc Elegoo"
                  brand: "Elegoo"
                  material: "PLA"
                  color_hex: "#FFFFFF"
                  color_name: "Blanc"
                  weight_remaining: 850
                  weight_total: 1000
                  temp_nozzle_min: 190
                  temp_nozzle_max: 220
                  archived: 0
    post:
      tags: [Filaments]
      summary: Créer un filament
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilamentInput'
            example:
              name: "PETG Noir"
              brand: "Bambu"
              material: "PETG"
              color_hex: "#000000"
              color_name: "Noir"
              weight_total: 1000
              weight_remaining: 1000
              temp_nozzle_min: 230
              temp_nozzle_max: 250
      responses:
        "201":
          description: Filament créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filament'

  /filaments/{id}:
    get:
      tags: [Filaments]
      summary: Détail d'un filament
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Détail du filament
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filament'
    put:
      tags: [Filaments]
      summary: Modifier un filament
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilamentInput'
      responses:
        "200":
          description: Filament mis à jour
    delete:
      tags: [Filaments]
      summary: Supprimer un filament
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Filament supprimé

  /filaments/import-csv:
    post:
      tags: [Filaments]
      summary: Importer des filaments depuis un CSV
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Contenu CSV avec en-têtes
      responses:
        "200":
          description: Import réussi
          content:
            application/json:
              example:
                imported: 5
                skipped: 1

  # ── IMPRESSIONS ───────────────────────────────────────────

  /prints:
    get:
      tags: [Impressions]
      summary: Lister les impressions
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [printing, done, failed, paused, queued, cancelled]
        - name: printer_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Liste des impressions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Print'
              example:
                - id: 1
                  name: "Support caméra"
                  status: "done"
                  filament_used: 45
                  actual_duration: 120
                  printer_name: "Elegoo Centauri"
                  filament_name: "PLA Blanc"
                  color_hex: "#FFFFFF"
    post:
      tags: [Impressions]
      summary: Créer une impression
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintInput'
            example:
              name: "Pied de lampe"
              printer_id: 1
              filament_id: 2
              status: "printing"
              estimated_duration: 180
      responses:
        "201":
          description: Impression créée

  /prints/{id}:
    get:
      tags: [Impressions]
      summary: Détail d'une impression
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Détail de l'impression
    put:
      tags: [Impressions]
      summary: Modifier une impression
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrintInput'
      responses:
        "200":
          description: Impression mise à jour
    delete:
      tags: [Impressions]
      summary: Supprimer une impression
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Impression supprimée

  /prints/{id}/status:
    patch:
      tags: [Impressions]
      summary: Changer le statut d'une impression
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            example:
              status: "done"
              filament_used: 48
              actual_duration: 135
      responses:
        "200":
          description: Statut mis à jour

  # ── IMPRIMANTES ───────────────────────────────────────────

  /printers:
    get:
      tags: [Imprimantes]
      summary: Lister les imprimantes
      responses:
        "200":
          description: Liste des imprimantes
          content:
            application/json:
              example:
                - id: 1
                  name: "Elegoo Centauri Carbon 2"
                  model: "Centauri Carbon 2"
                  status: "idle"
                  interface_url: "http://192.168.1.200"
    post:
      tags: [Imprimantes]
      summary: Ajouter une imprimante
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: "Bambu X1C"
              model: "X1 Carbon"
              status: "idle"
      responses:
        "201":
          description: Imprimante créée

  /printers/{id}:
    put:
      tags: [Imprimantes]
      summary: Modifier une imprimante
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            example:
              status: "printing"
      responses:
        "200":
          description: Imprimante mise à jour

  /printers/{id}/status:
    patch:
      tags: [Imprimantes]
      summary: Changer le statut d'une imprimante
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            example:
              status: "printing"
      responses:
        "200":
          description: Statut mis à jour

  # ── MAINTENANCE ───────────────────────────────────────────

  /maintenance:
    get:
      tags: [Maintenance]
      summary: Lister les entrées de maintenance
      responses:
        "200":
          description: Liste des maintenances
          content:
            application/json:
              example:
                - id: 1
                  printer_name: "Elegoo Centauri"
                  type: "nettoyage"
                  performed_at: "2026-04-01"
                  next_due: "2026-05-01"
                  description: "Nettoyage buse et plateau"
    post:
      tags: [Maintenance]
      summary: Créer une entrée de maintenance
      requestBody:
        required: true
        content:
          application/json:
            example:
              printer_id: 1
              type: "nettoyage"
              performed_at: "2026-04-08"
              next_due: "2026-05-08"
              description: "Nettoyage complet"
      responses:
        "201":
          description: Maintenance créée

  /maintenance/{id}:
    put:
      tags: [Maintenance]
      summary: Modifier une entrée de maintenance
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            example:
              next_due: "2026-06-01"
      responses:
        "200":
          description: Maintenance mise à jour
    delete:
      tags: [Maintenance]
      summary: Supprimer une entrée de maintenance
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Maintenance supprimée

  /maintenance/{id}/done:
    patch:
      tags: [Maintenance]
      summary: Marquer une maintenance comme effectuée
      description: Efface la date de prochaine échéance (retire l'alerte du dashboard)
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        "200":
          description: Maintenance marquée comme effectuée

  # ── STATISTIQUES ──────────────────────────────────────────

  /stats:
    get:
      tags: [Statistiques]
      summary: Statistiques globales
      responses:
        "200":
          description: Statistiques de l'application
          content:
            application/json:
              example:
                totals:
                  printer_count: 2
                  filament_count: 15
                  total_prints: 142
                  success: 130
                  failed: 12
                lowStock:
                  - id: 3
                    name: "PLA Rouge"
                    weight_remaining: 85
                    weight_total: 1000
                    pct_remaining: 9

  /stats/alerts:
    get:
      tags: [Statistiques]
      summary: Bobines sous le seuil d'alerte
      description: |
        Retourne les filaments dont le stock restant est sous le seuil configuré.

        **Exemple Home Assistant :**
        ```yaml
        sensor:
          - platform: rest
            name: "Filaments stock faible"
            resource: http://192.168.1.145/api/stats/alerts
            value_template: "{{ value_json | length }}"
            unit_of_measurement: bobines
            scan_interval: 3600
        ```
      responses:
        "200":
          description: Filaments en stock faible
          content:
            application/json:
              example:
                - id: 3
                  name: "PLA Rouge"
                  material: "PLA"
                  color_hex: "#FF0000"
                  weight_remaining: 85
                  weight_total: 1000
                  pct_remaining: 9

  /stats/consumption:
    get:
      tags: [Statistiques]
      summary: Consommation de filament
      parameters:
        - name: days
          in: query
          description: Nombre de jours en arrière (7, 30 ou 90)
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Données de consommation
          content:
            application/json:
              example:
                byMaterial:
                  - material: "PLA"
                    total_g: 1250
                  - material: "PETG"
                    total_g: 380
                byDay:
                  - date: "2026-04-08"
                    total_g: 145

  /stats/maintenance-alerts:
    get:
      tags: [Statistiques]
      summary: Maintenances à venir
      description: |
        Retourne les maintenances dont l'échéance est dans les N jours configurés.

        **Exemple Home Assistant :**
        ```yaml
        sensor:
          - platform: rest
            name: "Maintenances à prévoir"
            resource: http://192.168.1.145/api/stats/maintenance-alerts
            value_template: "{{ value_json | length }}"
            unit_of_measurement: maintenances
        ```
      responses:
        "200":
          description: Maintenances imminentes
          content:
            application/json:
              example:
                - id: 2
                  printer_name: "Elegoo Centauri"
                  type: "calibration"
                  next_due: "2026-04-15"
                  days_until: 7

  # ── HISTORIQUE ────────────────────────────────────────────

  /history:
    get:
      tags: [Historique]
      summary: Journal des modifications
      parameters:
        - name: entity
          in: query
          description: Filtrer par type d'entité
          schema:
            type: string
            enum: [filament, print, printer, project, library_object, nfc]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Entrées du journal
          content:
            application/json:
              example:
                - id: 1
                  entity: "filament"
                  entity_id: 3
                  action: "create"
                  detail: "Filament créé : PLA Rouge"
                  created_at: "2026-04-08T10:30:00Z"

  # ── NFC ───────────────────────────────────────────────────

  /nfc/history/{filamentId}:
    get:
      tags: [NFC]
      summary: Historique des écritures NFC d'un filament
      parameters:
        - name: filamentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Historique des écritures NFC
          content:
            application/json:
              example:
                - id: 1
                  uid: "04A3B2C1D0E5F6"
                  format: "elegoo"
                  material: "PLA"
                  subtype: "PLA+"
                  color_hex: "#FFFFFF"
                  written_at: "2026-04-08T09:15:00Z"

  # ── PARAMÈTRES ────────────────────────────────────────────

  /settings:
    get:
      tags: [Paramètres]
      summary: Lire les paramètres
      responses:
        "200":
          description: Paramètres de l'application
          content:
            application/json:
              example:
                app_name: "PrintFlow"
                theme: "blue"
                stock_alert_enabled: "true"
                stock_alert_threshold: "20"
                maintenance_alert_enabled: "true"
                maintenance_alert_days: "30"
    put:
      tags: [Paramètres]
      summary: Modifier les paramètres
      requestBody:
        required: true
        content:
          application/json:
            example:
              stock_alert_threshold: "15"
              maintenance_alert_days: "14"
      responses:
        "200":
          description: Paramètres mis à jour

components:

  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:

    Filament:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        brand:       { type: string }
        material:    { type: string, enum: [PLA, PETG, ABS, ASA, TPU, Nylon, PC, HIPS, PVA, autre] }
        color_hex:   { type: string, example: "#3b82f6" }
        color_name:  { type: string }
        diameter:    { type: number, example: 1.75 }
        weight_total:     { type: number }
        weight_remaining: { type: number }
        spool_weight:     { type: number }
        temp_nozzle_min:  { type: integer }
        temp_nozzle_max:  { type: integer }
        temp_bed_min:     { type: integer }
        temp_bed_max:     { type: integer }
        price:       { type: number }
        location:    { type: string }
        notes:       { type: string }
        nfc_uid:     { type: string }
        archived:    { type: integer, enum: [0, 1] }

    FilamentInput:
      type: object
      required: [name, material]
      properties:
        name:        { type: string }
        brand:       { type: string }
        material:    { type: string }
        color_hex:   { type: string }
        color_name:  { type: string }
        diameter:    { type: number }
        weight_total:     { type: number }
        weight_remaining: { type: number }
        temp_nozzle_min:  { type: integer }
        temp_nozzle_max:  { type: integer }
        temp_bed_min:     { type: integer }
        temp_bed_max:     { type: integer }
        price:       { type: number }
        location:    { type: string }
        notes:       { type: string }

    Print:
      type: object
      properties:
        id:               { type: integer }
        name:             { type: string }
        status:           { type: string, enum: [printing, done, failed, paused, queued, cancelled] }
        printer_id:       { type: integer }
        filament_id:      { type: integer }
        filament_used:    { type: number, description: "Grammes consommés" }
        estimated_duration: { type: integer, description: "Minutes" }
        actual_duration:    { type: integer, description: "Minutes" }
        progress:         { type: integer, description: "Pourcentage 0-100" }
        file_name:        { type: string }
        notes:            { type: string }
        created_at:       { type: string, format: date-time }

    PrintInput:
      type: object
      required: [name]
      properties:
        name:             { type: string }
        printer_id:       { type: integer }
        filament_id:      { type: integer }
        status:           { type: string }
        estimated_duration: { type: integer }
        actual_duration:    { type: integer }
        filament_used:    { type: number }
        progress:         { type: integer }
        file_name:        { type: string }
        notes:            { type: string }

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Requis uniquement si l'authentification est activée dans les paramètres

security:
  - ApiKeyAuth: []
  - {}
