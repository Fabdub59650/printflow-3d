<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintFlow API — Documentation</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css">
  <style>
    body { margin: 0; background: #1a1917; }
    #swagger-ui { max-width: 1200px; margin: 0 auto; }
    /* Adapter le thème Swagger au style PrintFlow */
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { color: #fff; }
    .swagger-ui .info { background: #1a1917; padding: 20px; }
    .swagger-ui .scheme-container { background: #232220; padding: 12px 20px; }
    .swagger-ui .opblock-tag { color: #ddd; border-bottom: 1px solid #333; }
    .swagger-ui .opblock { border-radius: 8px; margin-bottom: 8px; }
    /* Bouton retour */
    #back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #3b82f6; color: #fff; padding: 8px 16px;
      border-radius: 8px; text-decoration: none; font-size: 13px;
      font-family: system-ui, sans-serif; margin: 16px 20px;
      border: none; cursor: pointer;
    }
    #back-btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <a id="back-btn" href="/" onclick="history.back();return false;">
    ← Retour à PrintFlow
  </a>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-standalone-preset.js"></script>
  <script>
    window.onload = function() {
      SwaggerUIBundle({
        url: '/openapi.yaml',
        dom_id: '#swagger-ui',
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: 'StandaloneLayout',
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: 'list',
        filter: true,
        tryItOutEnabled: true,
        requestInterceptor: function(request) {
          // Ajouter automatiquement le token si présent
          var token = '';
          try { token = localStorage.getItem('pf_auth_token') || ''; } catch(_) {}
          if (token) request.headers['X-Auth-Token'] = token;
          return request;
        }
      });
    };
  </script>
</body>
</html>
