<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=1.0">
  <title>PrintFlow — Kiosque</title>
  <style>
    :root,
    [data-color-scheme="light"] {
      --bg:       #f5f6fa;
      --bg2:      #ffffff;
      --bg3:      #eef0f6;
      --text:     #111827;
      --text2:    #4b5563;
      --text3:    #9ca3af;
      --border:   #e5e7eb;
      --accent:   #3b82f6;
      --success:  #10b981;
      --warning:  #f59e0b;
      --danger:   #ef4444;
      --radius:   8px;
      --radius-lg:12px;
    }
    [data-color-scheme="dark"],
    @media (prefers-color-scheme: dark) { :root:not([data-color-scheme="light"]) {
      --bg:       #0f1117;
      --bg2:      #1a1d27;
      --bg3:      #22263a;
      --text:     #f0f2f8;
      --text2:    #9ca3c8;
      --text3:    #5a6080;
      --border:   #2a2f4a;
    }}
    [data-color-scheme="dark"] {
      --bg:       #0f1117;
      --bg2:      #1a1d27;
      --bg3:      #22263a;
      --text:     #f0f2f8;
      --text2:    #9ca3c8;
      --text3:    #5a6080;
      --border:   #2a2f4a;
    }
    * { margin:0; padding:0; box-sizing:border-box; cursor:none !important; }
    html, body {
      width:1024px; height:600px;
      overflow:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,sans-serif;
      font-size:16px;
      user-select:none;
      -webkit-user-select:none;
    }

    /* ── Topbar ── */
    #topbar {
      height:44px;
      background:var(--bg2);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      padding:0 16px;
      gap:12px;
      flex-shrink:0;
    }
    #topbar .logo {
      font-size:17px;
      font-weight:700;
      color:var(--text);
    }
    #topbar .logo span { color:var(--accent); }
    #clock {
      font-size:20px;
      font-weight:600;
      color:var(--text);
      margin-left:auto;
    }
    #date-display {
      font-size:13px;
      color:var(--text3);
    }
    #nfc-indicator {
      font-size:12px;
      color:var(--text3);
      display:flex;
      align-items:center;
      gap:6px;
    }
    #nfc-indicator .nfc-dot {
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--text3);
      flex-shrink:0;
      transition:background 0.3s;
    }
    #nfc-indicator.connected { color:var(--success); }
    #nfc-indicator.connected .nfc-dot { background:var(--success); }
    #nfc-indicator.detected { color:var(--accent); }
    #nfc-indicator.detected .nfc-dot {
      background:var(--accent);
      animation:nfc-pulse 0.6s ease-in-out infinite alternate;
    }
    @keyframes nfc-pulse {
      from { transform:scale(1); opacity:1; }
      to   { transform:scale(1.4); opacity:0.6; }
    }

    /* ── Overlay NFC filament ── */
    #nfc-overlay {
      display:none;
      position:fixed;
      inset:0;
      z-index:80;
      background:rgba(0,0,0,0.6);
      align-items:center;
      justify-content:center;
    }
    #nfc-overlay.visible { display:flex; }
    #nfc-card {
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      width:680px;
      max-height:500px;
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    #nfc-card-header {
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-shrink:0;
    }
    #nfc-card-body {
      flex:1;
      overflow-y:auto;
      padding:18px;
    }
    #nfc-card-footer {
      padding:12px 18px;
      border-top:1px solid var(--border);
      display:flex;
      gap:10px;
      align-items:center;
      flex-shrink:0;
    }
    #nfc-auto-close-bar {
      height:3px;
      background:var(--accent);
      border-radius:2px;
      transition:width linear;
    }

    /* ── Layout principal ── */
    #main {
      height:calc(600px - 44px - 64px);
      display:grid;
      grid-template-columns:1fr 1fr 1fr 240px;
      grid-template-rows:1fr 1fr;
      gap:8px;
      padding:8px;
    }

    /* ── Cards ── */
    .card {
      background:var(--bg2);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:12px 14px;
      overflow:hidden;
      position:relative;
    }
    .card-title {
      font-size:12px;
      font-weight:600;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:0.06em;
      margin-bottom:8px;
    }

    /* ── Imprimantes ── */
    .printer-card {
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .printer-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .printer-name {
      font-size:15px;
      font-weight:600;
      color:var(--text);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .printer-badge {
      font-size:11px;
      padding:2px 8px;
      border-radius:20px;
      font-weight:600;
      flex-shrink:0;
    }
    .badge-printing { background:#f59e0b22;color:#f59e0b; }
    .badge-idle     { background:#10b98122;color:#10b981; }
    .badge-offline  { background:#6b728022;color:#6b7280; }
    .badge-error    { background:#ef444422;color:#ef4444; }

    .printer-temps {
      display:flex;
      gap:12px;
      font-size:12px;
      min-height:0;
    }
    .printer-temps:empty { display:none; }
    .temp-item {
      display:flex;
      align-items:center;
      gap:4px;
    }
    .temp-val {
      font-size:15px;
      font-weight:700;
      color:var(--text);
    }
    .temp-target {
      font-size:11px;
      color:var(--text3);
    }

    .progress-wrap {
      height:8px;
      background:var(--bg3);
      border-radius:4px;
      overflow:hidden;
    }
    .progress-fill {
      height:100%;
      border-radius:4px;
      background:var(--accent);
      transition:width 0.5s ease;
    }

    .printer-file {
      font-size:12px;
      color:var(--text3);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .printer-eta {
      font-size:15px;
      font-weight:600;
      color:var(--accent);
    }
    .printer-model {
      font-size:11px;
      color:var(--text3);
    }

    /* ── Alertes ── */
    #alerts-card {
      grid-row:1 / 3;
      grid-column:4;
      display:flex;
      flex-direction:column;
    }
    .alert-item {
      display:flex;
      align-items:center;
      gap:8px;
      padding:7px 0;
      border-bottom:1px solid var(--border);
      font-size:12px;
    }
    .alert-item:last-child { border-bottom:none; }
    .alert-dot {
      width:6px; height:6px;
      border-radius:50%;
      flex-shrink:0;
    }

    /* ── Planning ── */
    #planning-card {
      grid-column:1 / 3;
      display:flex;
      flex-direction:column;
    }
    .plan-item {
      display:flex;
      align-items:center;
      gap:8px;
      padding:5px 0;
      border-bottom:1px solid var(--border);
      font-size:12px;
    }
    .plan-item:last-child { border-bottom:none; }
    .plan-date {
      font-size:11px;
      color:var(--text3);
      min-width:66px;
      flex-shrink:0;
    }
    .plan-overdue { color:var(--danger); }

    /* ── Stats jour ── */
    #stats-card {
      grid-column:3;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .stats-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      flex:1;
    }
    .stat-item {
      background:var(--bg3);
      border-radius:var(--radius);
      padding:8px 10px;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .stat-val {
      font-size:24px;
      font-weight:700;
      color:var(--text);
    }
    .stat-label {
      font-size:11px;
      color:var(--text3);
      text-transform:uppercase;
      letter-spacing:0.04em;
      margin-top:2px;
    }

    /* ── Boutons action ── */
    #actionbar {
      height:64px;
      background:var(--bg2);
      border-top:1px solid var(--border);
      display:flex;
      align-items:center;
      padding:0 12px;
      gap:10px;
    }
    .action-btn {
      height:44px;
      padding:0 20px;
      border-radius:var(--radius);
      border:1px solid var(--border);
      background:var(--bg3);
      color:var(--text);
      font-size:14px;
      font-weight:500;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:8px;
      transition:background 0.15s, border-color 0.15s;
      white-space:nowrap;
      -webkit-tap-highlight-color:transparent;
    }
    .action-btn:active { background:var(--bg); }
    .action-btn.primary {
      background:var(--accent);
      border-color:var(--accent);
      color:#fff;
    }
    .action-btn.primary:active { background:#2563eb; }
    #last-update {
      font-size:11px;
      color:var(--text3);
      margin-left:8px;
    }

    /* ── Notification plein écran ── */
    #notification-overlay {
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.85);
      z-index:100;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:16px;
    }
    #notification-overlay.visible { display:flex; }
    .notif-icon { font-size:64px; }
    .notif-title {
      font-size:32px;
      font-weight:700;
      color:var(--text);
      text-align:center;
    }
    .notif-sub {
      font-size:18px;
      color:var(--text2);
      text-align:center;
    }
    .notif-close {
      margin-top:8px;
      padding:12px 32px;
      border-radius:var(--radius);
      border:none;
      background:var(--bg3);
      color:var(--text);
      font-size:15px;
      cursor:pointer;
    }

    /* ── Mode nuit ── */
    body.night-mode { filter:brightness(0.4); }
    body.night-mode

    /* ── Spinner ── */
    .spin { animation:spin 1s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── Scrollbar invisible ── */
    ::-webkit-scrollbar { display:none; }
  </style>
</head>
<body>
<!-- Topbar -->
<div id="topbar">
  <div class="logo">Print<span>Flow</span> <span style="font-size:11px;color:var(--text3);font-weight:400">Kiosque</span></div>
  <div id="nfc-indicator"><span class="nfc-dot"></span>NFC</div>
  <div id="clock">--:--</div>
  <div id="date-display">--- -- ---</div>
</div>

<!-- Contenu principal -->
<div id="main">
  <!-- Imprimante 1 -->
  <div class="card printer-card" id="printer-0">
    <div class="card-title">Imprimante 1</div>
    <div class="printer-header">
      <div class="printer-name">—</div>
      <div class="printer-badge badge-offline">Hors ligne</div>
    </div>
    <div class="printer-model"></div>
    <div class="printer-temps"></div>
    <div class="progress-wrap" style="display:none">
      <div class="progress-fill" style="width:0%"></div>
    </div>
    <div class="printer-file"></div>
    <div class="printer-eta"></div>
  </div>

  <!-- Imprimante 2 -->
  <div class="card printer-card" id="printer-1">
    <div class="card-title">Imprimante 2</div>
    <div class="printer-header">
      <div class="printer-name">—</div>
      <div class="printer-badge badge-offline">Hors ligne</div>
    </div>
    <div class="printer-model"></div>
    <div class="printer-temps"></div>
    <div class="progress-wrap" style="display:none">
      <div class="progress-fill" style="width:0%"></div>
    </div>
    <div class="printer-file"></div>
    <div class="printer-eta"></div>
  </div>

  <!-- Imprimante 3 -->
  <div class="card printer-card" id="printer-2">
    <div class="card-title">Imprimante 3</div>
    <div class="printer-header">
      <div class="printer-name">—</div>
      <div class="printer-badge badge-offline">Hors ligne</div>
    </div>
    <div class="printer-model"></div>
    <div class="printer-temps"></div>
    <div class="progress-wrap" style="display:none">
      <div class="progress-fill" style="width:0%"></div>
    </div>
    <div class="printer-file"></div>
    <div class="printer-eta"></div>
  </div>

  <!-- Alertes (colonne droite sur 2 lignes) -->
  <div class="card" id="alerts-card">
    <div class="card-title">! Alertes</div>
    <div id="alerts-list" style="flex:1;overflow-y:auto">
      <div style="color:var(--text3);font-size:12px">Chargement…</div>
    </div>
  </div>

  <!-- Planning -->
  <div class="card" id="planning-card">
    <div class="card-title">Planning</div>
    <div id="planning-list" style="flex:1;overflow-y:auto">
      <div style="color:var(--text3);font-size:12px">Chargement…</div>
    </div>
  </div>

  <!-- Stats du jour -->
  <div class="card" id="stats-card">
    <div class="card-title">Aujourd'hui</div>
    <div class="stats-grid">
      <div class="stat-item">
        <div class="stat-val" id="stat-total">—</div>
        <div class="stat-label">Impressions</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-rate" style="color:var(--success)">—</div>
        <div class="stat-label">Taux réussite</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-hours">—</div>
        <div class="stat-label">Heures</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-grams">—</div>
        <div class="stat-label">Filament</div>
      </div>
    </div>
  </div>
</div>

<!-- Barre d'actions -->
<div id="actionbar">
  <button class="action-btn primary" onclick="kioskAction('print')">+ Nouvelle impression</button>
  <button class="action-btn" onclick="kioskAction('schedule')">Planning</button>
  <button class="action-btn" onclick="kioskAction('weigh')">Pesée</button>
  <button class="action-btn" onclick="kioskAction('filaments')">Filaments</button>
  <div id="last-update"></div>
</div>

<!-- ── Panneaux overlay kiosque ───────────────────────────────── -->
<div id="kiosk-panel" style="display:none;position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,0.7);align-items:center;justify-content:center">
  <div id="kiosk-panel-inner" style="background:var(--bg2);border:1px solid var(--border);
    border-radius:var(--radius-lg);width:760px;max-height:520px;
    display:flex;flex-direction:column;overflow:hidden">
    <div style="display:flex;align-items:center;justify-content:space-between;
      padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0">
      <span id="kiosk-panel-title" style="font-size:16px;font-weight:600"></span>
      <button onclick="kioskClosePanel()" style="width:36px;height:36px;border-radius:50%;
        border:1px solid var(--border);background:var(--bg3);color:var(--text2);
        font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center">X</button>
    </div>
    <div id="kiosk-panel-body" style="flex:1;overflow-y:auto;padding:18px"></div>
  </div>
</div>

<!-- Notification plein écran -->
<div id="notification-overlay">
  <div class="notif-icon" id="notif-icon">OK</div>
  <div class="notif-title" id="notif-title"></div>
  <div class="notif-sub" id="notif-sub"></div>
  <button class="notif-close" onclick="closeNotification()">Fermer</button>
</div>

<!-- Overlay NFC filament -->
<div id="nfc-overlay">
  <div id="nfc-card">
    <div id="nfc-card-header">
      <div style="display:flex;align-items:center;gap:10px">
        <span id="nfc-color-dot" style="width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-block"></span>
        <span id="nfc-filament-name" style="font-size:16px;font-weight:600"></span>
      </div>
      <button onclick="nfcCloseOverlay()" style="width:32px;height:32px;border-radius:50%;
        border:1px solid var(--border);background:var(--bg3);color:var(--text2);
        font-size:16px;cursor:pointer">X</button>
    </div>
    <div id="nfc-card-body"></div>
    <div id="nfc-card-footer">
      <button class="action-btn primary" onclick="nfcGoWeigh()" id="nfc-btn-weigh">
        Peser cette bobine
      </button>
      <button class="action-btn" onclick="nfcCloseOverlay()">Fermer</button>
      <div style="flex:1"></div>
      <div style="font-size:11px;color:var(--text3)">Fermeture auto dans <span id="nfc-countdown">10</span>s</div>
    </div>
    <div id="nfc-auto-close-bar" style="width:100%"></div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const API_BASE     = '';
const REFRESH_MS   = 10000; // 10 secondes
const NIGHT_FROM   = 22;
const NIGHT_TO     = 7;

// État
let _printers      = [];
let _moonrakerData = {};
let _prevStatus    = {}; // pour détecter les changements de statut
let _refreshTimer  = null;

// ── Horloge ───────────────────────────────────────────────────────────────
function updateClock() {
  const now  = new Date();
  const hh   = String(now.getHours()).padStart(2,'0');
  const mm   = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('clock').textContent = hh + ':' + mm;

  const days  = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
  const months= ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
  document.getElementById('date-display').textContent =
    days[now.getDay()] + ' ' + now.getDate() + ' ' + months[now.getMonth()] + ' ' + now.getFullYear();

  // Mode nuit automatique
  const h = now.getHours();
  const isNight = h >= NIGHT_FROM || h < NIGHT_TO;
  document.body.classList.toggle('night-mode', isNight);
}
setInterval(updateClock, 1000);
updateClock();

// ── API helper ────────────────────────────────────────────────────────────
function kioskToken() {
  try { return localStorage.getItem('pf_auth_token') || ''; } catch(_) { return ''; }
}

function kioskFetch(path, opts) {
  const token = kioskToken();
  const headers = Object.assign({ 'Content-Type': 'application/json' }, opts && opts.headers || {});
  if (token) headers['X-Auth-Token'] = token;
  return fetch(API_BASE + '/api' + path, Object.assign({}, opts || {}, { headers }));
}

async function apiGet(path) {
  const r = await kioskFetch(path);
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// ── Rendu imprimante ──────────────────────────────────────────────────────
function renderPrinter(idx, printer, mr) {
  const card = document.getElementById('printer-' + idx);
  if (!card) return;

  card.querySelector('.printer-name').textContent = printer.name;
  card.querySelector('.printer-model').textContent = printer.model || '';

  const badge  = card.querySelector('.printer-badge');
  const progWrap = card.querySelector('.progress-wrap');
  const progFill = card.querySelector('.progress-fill');
  const fileEl = card.querySelector('.printer-file');
  const etaEl  = card.querySelector('.printer-eta');
  const tempsEl= card.querySelector('.printer-temps');

  // Moonraker data
  if (mr && mr.available) {
    const isPrinting = mr.state === 'printing';
    const isPaused   = mr.state === 'paused';

    badge.className = 'printer-badge ' +
      (isPrinting ? 'badge-printing' : isPaused ? 'badge-printing' :
       mr.state === 'error' ? 'badge-error' : 'badge-idle');
    badge.textContent = isPrinting ? 'En cours' : isPaused ? 'Pause' :
      mr.state === 'error' ? 'Erreur' : 'Libre';

    // Températures (format extruder.temp / bed.temp)
    const nt = mr.extruder?.temp   || 0; const ntt = mr.extruder?.target || 0;
    const bt = mr.bed?.temp        || 0; const btt = mr.bed?.target       || 0;
    tempsEl.innerHTML =
      '<div class="temp-item">T<span class="temp-val">' + Math.round(nt) + '°</span>' +
        '<span class="temp-target">/' + Math.round(ntt) + '°</span></div>' +
      '<div class="temp-item">P<span class="temp-val">' + Math.round(bt) + '°</span>' +
        '<span class="temp-target">/' + Math.round(btt) + '°</span></div>';

    // Progression (déjà en %)
    if (isPrinting && mr.progress > 0) {
      progWrap.style.display = 'block';
      progFill.style.width   = mr.progress + '%';
      progFill.style.background = mr.progress > 80 ? '#10b981' : '#3b82f6';
    } else {
      progWrap.style.display = 'none';
    }

    // Fichier & ETA (remaining en minutes)
    fileEl.textContent = mr.filename ? '» ' + mr.filename : '';
    if (isPrinting && mr.remaining > 0) {
      const h = Math.floor(mr.remaining / 60);
      const m = mr.remaining % 60;
      etaEl.textContent = '→ ' + (h > 0 ? h + 'h ' : '') + m + 'min restant';
      etaEl.style.color = 'var(--accent)';
    } else {
      etaEl.textContent = isPrinting && mr.duration > 0
        ? '→ ' + Math.floor(mr.duration/60) + 'h' + (mr.duration%60) + 'min écoulé'
        : '';
    }

    // Détecter fin d'impression
    const prev = _prevStatus[printer.id];
    if (prev === 'printing' && mr.state === 'complete') {
      showNotification('OK', 'Impression terminée', printer.name + (mr.filename ? ' — ' + mr.filename : ''), 'success');
    } else if (prev === 'printing' && mr.state === 'error') {
      showNotification('ERR', 'Impression échouée', printer.name, 'danger');
    }
    _prevStatus[printer.id] = mr.state;

    // Bordure colorée selon état
    card.style.borderColor = isPrinting ? '#f59e0b' : isPaused ? '#8b5cf6' :
      mr.state === 'error' ? '#ef4444' : 'var(--border)';

  } else {
    // Pas de Moonraker
    badge.className = 'printer-badge ' + (printer.status === 'printing' ? 'badge-printing' :
      printer.status === 'idle' ? 'badge-idle' : 'badge-offline');
    badge.textContent = printer.status === 'printing' ? 'En cours' :
      printer.status === 'idle' ? 'Libre' : 'Hors ligne';
    tempsEl.innerHTML = '';
    progWrap.style.display = 'none';
    fileEl.textContent = '';
    etaEl.textContent = '';
    card.style.borderColor = 'var(--border)';
  }
}

// ── Alertes ───────────────────────────────────────────────────────────────
function renderAlerts(stockAlerts, bobineAlerts, maintAlerts) {
  const list = document.getElementById('alerts-list');
  const items = [];

  (bobineAlerts || []).forEach(function(a) {
    items.push({
      icon: a.severity === 'critical' ? '!!' : '!',
      text: a.print_name + ' — stock insuffisant (' + a.stock_remaining + 'g/' + a.estimated_g + 'g)',
      color: a.severity === 'critical' ? 'var(--danger)' : 'var(--warning)',
    });
  });

  (stockAlerts || []).slice(0,4).forEach(function(f) {
    const pct = f.pct_remaining || 0;
    items.push({
      icon: pct < 10 ? '!!' : '!',
      text: f.name + ' — ' + pct + '% restant',
      color: pct < 10 ? 'var(--danger)' : 'var(--warning)',
    });
  });

  (maintAlerts || []).slice(0,2).forEach(function(m) {
    items.push({
      icon: '~',
      text: (m.printer_name||'—') + ' — ' + (m.type||'').replace(/_/g,' '),
      color: 'var(--text2)',
    });
  });

  if (!items.length) {
    list.innerHTML = '<div style="color:var(--success);font-size:12px">Aucune alerte</div>';
    return;
  }

  list.innerHTML = items.map(function(a) {
    return '<div class="alert-item">' +
      '<span style="font-size:14px;flex-shrink:0">' + a.icon + '</span>' +
      '<span style="color:' + a.color + ';font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + a.text + '</span>' +
    '</div>';
  }).join('');
}

// ── Planning ──────────────────────────────────────────────────────────────
function renderPlanning(prints) {
  const list = document.getElementById('planning-list');
  const now  = new Date();
  const planned = (prints || [])
    .filter(function(p) { return p.status === 'planned' || p.status === 'printing'; })
    .slice(0, 6);

  if (!planned.length) {
    list.innerHTML = '<div style="color:var(--text3);font-size:12px">Aucune impression planifiée</div>';
    return;
  }

  list.innerHTML = planned.map(function(p) {
    const overdue = p.planned_at && new Date(p.planned_at) < now && p.status === 'planned';
    const dateStr = p.planned_at
      ? new Date(p.planned_at).toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'short'})
      : 'Sans date';
    return '<div class="plan-item">' +
      '<span class="plan-date ' + (overdue ? 'plan-overdue' : '') + '">' + dateStr + '</span>' +
      '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:' +
        (overdue ? 'var(--danger)' : 'var(--text)') + '">' + p.name + '</span>' +
      (p.status === 'printing' ? '<span style="color:var(--warning);font-size:10px;flex-shrink:0">▶</span>' : '') +
    '</div>';
  }).join('');
}

// ── Stats du jour ─────────────────────────────────────────────────────────
function renderStats(prints) {
  const today  = new Date().toISOString().slice(0,10);
  const todayP = (prints || []).filter(function(p) {
    return p.created_at && p.created_at.slice(0,10) === today &&
      ['done','failed','cancelled'].includes(p.status);
  });

  const total   = todayP.length;
  const success = todayP.filter(function(p){ return p.status==='done'; }).length;
  const rate    = total > 0 ? Math.round(success/total*100) : 0;
  const hours   = Math.round(todayP.reduce(function(s,p){ return s+(parseFloat(p.actual_duration)||0); },0)/60*10)/10;
  const grams   = Math.round(todayP.reduce(function(s,p){ return s+(parseFloat(p.filament_used)||0); },0));

  document.getElementById('stat-total').textContent = total || '—';
  document.getElementById('stat-rate').textContent  = total ? rate+'%' : '—';
  document.getElementById('stat-rate').style.color  = rate>=90?'var(--success)':rate>=70?'var(--warning)':'var(--danger)';
  document.getElementById('stat-hours').textContent = hours ? hours+'h' : '—';
  document.getElementById('stat-grams').textContent = grams ? grams+'g' : '—';
}

// ── Refresh principal ─────────────────────────────────────────────────────
async function kioskRefresh(manual) {
  if (manual && btn) btn.classList.add('spin');

  try {
    // Données parallèles
    const [printers, prints, stockAlerts, bobineAlerts, maintAlerts] = await Promise.all([
      apiGet('/printers'),
      apiGet('/prints?limit=200'),
      apiGet('/consumables/alerts').catch(function(){ return []; }),
      apiGet('/alerts/bobines').catch(function(){ return []; }),
      apiGet('/stats/maintenance-alerts').catch(function(){ return []; }),
    ]);

    _printers = printers;

    // Moonraker pour chaque imprimante compatible
    const mrPromises = printers.slice(0,3).map(function(p) {
      if (!['moonraker','fluidd','mainsail','klipper'].includes(p.interface_type)) return Promise.resolve(null);
      return apiGet('/moonraker/' + p.id + '/status').catch(function(){ return null; });
    });
    const mrData = await Promise.all(mrPromises);

    // Rendu imprimantes (max 2 sur l'écran)
    printers.slice(0,3).forEach(function(p, i) {
      renderPrinter(i, p, mrData[i]);
    });

    // Si 1 seule imprimante, cacher la 2ème card
    const card1 = document.getElementById('printer-1');
    const card2 = document.getElementById('printer-2');
    if (card1) card1.style.display = printers.length < 2 ? 'none' : '';
    if (card2) card2.style.display = printers.length < 3 ? 'none' : '';

    renderAlerts(stockAlerts, bobineAlerts, maintAlerts);
    renderPlanning(prints);
    renderStats(prints);

    // Mise à jour
    const now = new Date();
    document.getElementById('last-update').textContent =
      'Mis à jour ' + String(now.getHours()).padStart(2,'0') + ':' +
      String(now.getMinutes()).padStart(2,'0') + ':' +
      String(now.getSeconds()).padStart(2,'0');

  } catch(e) {
    console.error('Kiosk refresh error:', e);
  }

  if (manual && btn) btn.classList.remove('spin');
}

// ── Notification ──────────────────────────────────────────────────────────
let _notifTimer = null;

function showNotification(icon, title, sub, type) {
  document.getElementById('notif-icon').textContent  = icon;
  document.getElementById('notif-title').textContent = title;
  document.getElementById('notif-sub').textContent   = sub || '';
  const overlay = document.getElementById('notification-overlay');
  overlay.style.background = type === 'success' ? 'rgba(16,185,129,0.15)' : 'rgba(239,68,68,0.15)';
  overlay.classList.add('visible');
  if (_notifTimer) clearTimeout(_notifTimer);
  _notifTimer = setTimeout(closeNotification, 6000);
}

function closeNotification() {
  document.getElementById('notification-overlay').classList.remove('visible');
}

// ── Actions boutons ───────────────────────────────────────────────────────
function kioskAction(action) {
  kioskOpenPanel(action);
}

function kioskOpenPanel(action) {
  const panel = document.getElementById('kiosk-panel');
  const title = document.getElementById('kiosk-panel-title');
  const body  = document.getElementById('kiosk-panel-body');
  panel.style.display = 'flex';

  if (action === 'print') {
    title.textContent = '+ Nouvelle impression';
    body.innerHTML = kioskPanelPrint();
  } else if (action === 'schedule') {

    kioskPanelSchedule(body);
  } else if (action === 'weigh') {
    title.textContent = 'Pesée rapide';
    kioskPanelWeigh(body);
  } else if (action === 'filaments') {
    title.textContent = 'Filaments';
    kioskPanelFilaments(body);
  }
}

function kioskClosePanel() {
  document.getElementById('kiosk-panel').style.display = 'none';
}

// ── Clavier virtuel kiosque ───────────────────────────────────────────────

let _vkbTarget = null; // id du champ en cours de saisie

const VKB_ROWS_ALPHA = [
  ['1','2','3','4','5','6','7','8','9','0','-'],
  ['a','z','e','r','t','y','u','i','o','p'],
  ['q','s','d','f','g','h','j','k','l','m'],
  ['w','x','c','v','b','n','⌫','ESPACE','OK'],
];

const VKB_ROWS_NUM = [
  ['7','8','9'],
  ['4','5','6'],
  ['1','2','0'],
  ['⌫','OK'],
];

function openVirtualKeyboard(targetId, numOnly) {
  _vkbTarget = targetId;
  const existing = document.getElementById('vkb-overlay');
  if (existing) existing.remove();

  const rows = numOnly ? VKB_ROWS_NUM : VKB_ROWS_ALPHA;
  const field = document.getElementById(targetId);
  const label = field ? field.closest('div')?.querySelector('label')?.textContent || '' : '';

  let keysHtml = rows.map(function(row) {
    return '<div style="display:flex;gap:6px;justify-content:center;margin-bottom:6px">' +
      row.map(function(k) {
        const w = k === 'ESPACE' ? '120px' : k === 'OK' ? '80px' : k === '⌫' ? '64px' : numOnly ? '70px' : '42px';
        const bg = k === 'OK' ? 'var(--accent)' : k === '⌫' ? '#ef4444' : 'var(--bg3)';
        const col = (k === 'OK' || k === '⌫') ? '#fff' : 'var(--text)';
        return '<button onclick="vkbPress(\'' + k + '\')" ' +
          'style="width:' + w + ';height:48px;background:' + bg + ';color:' + col + ';' +
          'border:1px solid var(--border);border-radius:var(--radius);font-size:16px;' +
          'font-weight:500;cursor:pointer;-webkit-tap-highlight-color:transparent">' +
          (k === 'ESPACE' ? '␣' : k) +
        '</button>';
      }).join('') +
    '</div>';
  }).join('');

  const overlay = document.createElement('div');
  overlay.id = 'vkb-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;' +
    'display:flex;align-items:flex-end;justify-content:center';

  overlay.innerHTML =
    '<div style="background:var(--bg2);border-top:1px solid var(--border);width:100%;padding:16px">' +
      // Affichage valeur courante
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">' +
        '<span style="font-size:12px;color:var(--text3);flex-shrink:0">' + label + '</span>' +
        '<div id="vkb-display" style="flex:1;background:var(--bg3);border:1px solid var(--border);' +
          'border-radius:var(--radius);padding:10px 14px;font-size:18px;font-weight:500;' +
          'color:var(--text);min-height:46px;letter-spacing:0.05em">' +
          (field ? field.value : '') +
        '</div>' +
        '<button onclick="vkbClose()" style="padding:10px 16px;background:var(--bg3);' +
          'color:var(--text2);border:1px solid var(--border);border-radius:var(--radius);' +
          'font-size:13px;cursor:pointer;flex-shrink:0">Annuler</button>' +
      '</div>' +
      keysHtml +
    '</div>';

  document.body.appendChild(overlay);
}

function vkbPress(key) {
  const field   = document.getElementById(_vkbTarget);
  const display = document.getElementById('vkb-display');
  if (!field) return;

  if (key === 'OK') {
    vkbClose();
    return;
  }
  if (key === '⌫') {
    field.value = field.value.slice(0, -1);
  } else if (key === 'ESPACE') {
    field.value += ' ';
  } else {
    field.value += key;
  }
  if (display) display.textContent = field.value;
}

function vkbClose() {
  const overlay = document.getElementById('vkb-overlay');
  if (overlay) overlay.remove();
  _vkbTarget = null;
}

async function kioskSavePrint() {
  const name     = document.getElementById('kp-name')?.value?.trim();
  const printer  = document.getElementById('kp-printer')?.value;
  const file     = document.getElementById('kp-file')?.value?.trim();
  const duration = document.getElementById('kp-duration')?.value;
  if (!name) { document.getElementById('kp-name').style.borderColor='var(--danger)'; return; }
  try {
    await kioskFetch('/prints', { method:'POST',
      body: JSON.stringify({ name, printer_id:printer||null, file_source:file||null,
        estimated_duration:duration||null, status:'printing' }) });
    kioskClosePanel();
    kioskRefresh(false);
    showNotification('OK', 'Impression créée', name, 'success');
  } catch(e) { console.error(e); }
}

// ── Panneau Pesée ──────────────────────────────────────────────────────────
async function kioskPanelWeigh(body) {
  body.innerHTML = '<div style="color:var(--text3)">Chargement…</div>';
  try {

          '</div>' +

      }).join('') +
      '</div>';
  } catch(e) { body.innerHTML = '<div style="color:var(--danger)">Erreur chargement</div>'; }
}

// Filament courant pour la pesée
var _weighFilament = null;

function kioskWeighSelect(id) {
  _weighFilament = allFilaments ? allFilaments.find(function(f){ return f.id === id; }) : null;
  // Charger le filament depuis l'API si pas en mémoire
  if (!_weighFilament) {
    kioskFetch('/filaments/'+id).then(function(r){ return r.json(); }).then(function(f){
      _weighFilament = f;
      kioskRenderWeighPad();
    });
  } else {
    kioskRenderWeighPad();
  }
}

// allFilaments local au kiosque
var allFilaments = null;
var _weighInput = '0';

function kioskRenderWeighPad() {
  const f    = _weighFilament;
  const body = document.getElementById('kiosk-panel-body');
  const tareG = parseFloat(f ? f.spool_weight : 0) || 0;

  function updateNet(raw) {
    const brut = parseFloat(raw) || 0;
    const net  = Math.max(0, brut - tareG);
    const pct  = f && f.weight_total > 0 ? Math.round(net / f.weight_total * 100) : 0;
    const netEl = document.getElementById('kw-net');
    if (netEl) {
      netEl.textContent = 'Net estimé : ' + net + 'g' + (tareG > 0 ? ' (brut ' + brut + 'g - tare ' + tareG + 'g)' : '');
      netEl.style.color = pct < 15 ? 'var(--danger)' : pct < 25 ? 'var(--warning)' : 'var(--success)';
    }
  }

  _weighInput = '0';

  // Bouton du pavé
  function padBtn(label, action, style) {
    return '<button onclick="kioskPadPress(&quot;'+action+'&quot;)" ' +
      'style="height:56px;font-size:18px;font-weight:600;border-radius:var(--radius);cursor:pointer;' +
      'border:1px solid var(--border);background:var(--bg3);color:var(--text);' +
      '-webkit-tap-highlight-color:transparent;' + (style||'') + '">' + label + '</button>';
  }

  body.innerHTML =
    '<div style="display:flex;gap:20px;align-items:flex-start">' +

    // Colonne gauche : infos + affichage + net
    '<div style="flex:1;display:flex;flex-direction:column;gap:12px">' +
      (f ? '<div style="background:var(--bg3);border-radius:var(--radius);padding:12px">' +
        '<div style="font-size:15px;font-weight:700;margin-bottom:4px">'+f.name+'</div>' +
        '<div style="font-size:12px;color:var(--text3)">'+f.material+(f.brand?' · '+f.brand:'')+'</div>' +
        (f.spool_number ? '<div style="font-size:12px;color:var(--text3);margin-top:2px">N° bobine : '+f.spool_number+'</div>' : '') +
        (tareG > 0 ? '<div style="font-size:12px;color:var(--text3);margin-top:4px">Tare bobine : '+tareG+'g</div>' :
          '<div style="font-size:11px;color:var(--warning);margin-top:4px">! Tare non renseignée — poids net = poids brut</div>') +
      '</div>' : '') +

      // Affichage valeur saisie
      '<div style="background:var(--bg);border:2px solid var(--accent);border-radius:var(--radius);' +
        'padding:16px;text-align:right">' +
        '<div id="kw-display" style="font-size:36px;font-weight:700;color:var(--text);' +
          'font-variant-numeric:tabular-nums;letter-spacing:2px">0</div>' +
        '<div style="font-size:12px;color:var(--text3);margin-top:4px">grammes (poids brut)</div>' +
      '</div>' +

      // Résultat net
      '<div id="kw-net" style="font-size:13px;font-weight:600;padding:10px 12px;' +
        'background:var(--bg3);border-radius:var(--radius)">Net estimé : 0g</div>' +

      // Boutons action
      '<div style="display:flex;gap:10px;margin-top:4px">' +
        '<button onclick="kioskBackToWeigh()" ' +
          'style="flex:1;height:48px;background:var(--bg3);color:var(--text2);' +
          'border:1px solid var(--border);border-radius:var(--radius);font-size:14px;cursor:pointer">← Retour</button>' +
        '<button onclick="kioskSaveWeight('+f.id+')" ' +
          'style="flex:2;height:48px;background:var(--accent);color:#fff;' +
          'border:none;border-radius:var(--radius);font-size:14px;font-weight:700;cursor:pointer">Enregistrer</button>' +
      '</div>' +
    '</div>' +

    // Colonne droite : pavé numérique
    '<div style="display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(4,56px);gap:8px">' +
      padBtn('7','7') + padBtn('8','8') + padBtn('9','9') +
      padBtn('4','4') + padBtn('5','5') + padBtn('6','6') +
      padBtn('1','1') + padBtn('2','2') + padBtn('3','3') +
      padBtn('←','back','color:var(--warning)') +
      padBtn('0','0') +
      padBtn('C','clear','color:var(--danger)') +
    '</div>' +

    '</div>';

  updateNet('0');
}

function kioskPadPress(key) {
  if (key === 'clear') {
    _weighInput = '0';
  } else if (key === 'back') {
    _weighInput = _weighInput.length > 1 ? _weighInput.slice(0,-1) : '0';
  } else {
    if (_weighInput === '0') _weighInput = key;
    else if (_weighInput.length < 6) _weighInput += key;
  }
  const display = document.getElementById('kw-display');
  if (display) display.textContent = _weighInput;

  // Mettre à jour le net
  const f = _weighFilament;
  const tareG = parseFloat(f ? f.spool_weight : 0) || 0;
  const brut = parseFloat(_weighInput) || 0;
  const net  = Math.max(0, brut - tareG);
  const pct  = f && f.weight_total > 0 ? Math.round(net / f.weight_total * 100) : 0;
  const netEl = document.getElementById('kw-net');
  if (netEl) {
    netEl.textContent = 'Net estimé : ' + net + 'g' + (tareG > 0 ? ' (brut ' + brut + 'g - tare ' + tareG + 'g)' : '');
    netEl.style.color = pct < 15 ? 'var(--danger)' : pct < 25 ? 'var(--warning)' : 'var(--success)';
  }
}

function kioskBackToWeigh() { kioskPanelWeigh(document.getElementById('kiosk-panel-body')); }

async function kioskSaveWeight(id) {
  const f     = _weighFilament;
  const tareG = parseFloat(f ? f.spool_weight : 0) || 0;
  const brut  = parseFloat(_weighInput) || 0;
  if (brut <= 0) return;
  const net = Math.max(0, brut - tareG);
  try {
    await kioskFetch('/filaments/'+id+'/weigh', { method:'PATCH',
      body: JSON.stringify({ weight_remaining: net }) });
    kioskClosePanel();
    showNotification('OK', 'Stock mis à jour', net + 'g net enregistré', 'success');
    kioskRefresh(false);
  } catch(e) { console.error(e); }
}

// ── Panneau Filaments ──────────────────────────────────────────────────────
async function kioskPanelFilaments(body) {
  body.innerHTML = '<div style="color:var(--text3)">Chargement…</div>';
  try {
    const filaments = await apiGet('/filaments');
    const active = filaments.filter(function(f){ return !f.archived; });
    body.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">' +
      active.map(function(f) {
        const pct = f.weight_total>0?Math.round(f.weight_remaining/f.weight_total*100):0;
        const col = pct<15?'#ef4444':pct<25?'#f59e0b':'#10b981';
        return '<div style="background:var(--bg3);border:1px solid var(--border);' +
          'border-radius:var(--radius);padding:10px 12px">' +

          // Titre + N° bobine
          '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">' +
            '<span style="width:8px;height:8px;border-radius:50%;background:'+(f.color_hex||'#ccc')+';flex-shrink:0"></span>' +
            '<span style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">'+f.name+'</span>' +
            (f.spool_number ? '<span style="font-size:10px;color:var(--text3);background:var(--bg2);' +
              'border:1px solid var(--border);border-radius:8px;padding:1px 6px;flex-shrink:0;white-space:nowrap">' +
              '#'+f.spool_number+'</span>' : '') +
          '</div>' +

          '<div style="font-size:11px;color:var(--text3)">'+f.material+(f.brand?' · '+f.brand:'')+'</div>' +
          '<div style="font-size:12px;font-weight:600;color:'+col+';margin-top:4px">'+Math.round(f.weight_remaining)+'g ('+pct+'%)</div>' +
          '<div style="height:4px;background:var(--border);border-radius:2px;margin-top:4px">' +
            '<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:2px"></div>' +
          '</div>' +

          // Bouton fiche filament
          '<button onclick="kioskShowFilamentFiche('+f.id+')" ' +
            'style="margin-top:8px;width:100%;padding:6px;background:var(--bg2);' +
            'border:1px solid var(--border);border-radius:var(--radius);' +
            'font-size:11px;color:var(--text2);cursor:pointer;' +
            '-webkit-tap-highlight-color:transparent">' +
            'Voir la fiche' +
          '</button>' +

        '</div>';
      }).join('') +
    '</div>';
  } catch(e) { body.innerHTML = '<div style="color:var(--danger)">Erreur chargement</div>'; }
}

async function kioskShowFilamentFiche(id) {
  try {
    const f = await kioskFetch('/filaments/'+id).then(function(r){ return r.json(); });
    // Fermer le panneau filaments et ouvrir l'overlay NFC (même format)
    kioskClosePanel();
    nfcShowOverlay(f);
  } catch(e) {
    console.error('Erreur fiche filament:', e);
  }
}

// ── Thème — lire depuis les settings ────────────────────────────────────

function initTheme() {
  // Kiosque toujours en thème clair
  document.documentElement.setAttribute('data-color-scheme', 'light');
}

// ── NFC — SSE temps réel ─────────────────────────────────────────────────

let _nfcAutoCloseTimer  = null;
let _nfcAutoCloseStart  = null;
let _nfcCurrentFilament = null;
const NFC_AUTO_CLOSE_MS = 10000;

function initNfcSse() {
  const indicator = document.getElementById('nfc-indicator');
  let es;

  function connect() {
    es = new EventSource('/api/nfc/events');

    es.addEventListener('status', function(e) {
      const data = JSON.parse(e.data);
      if (indicator) {
        indicator.className = data.available ? 'connected' : '';
        indicator.querySelector('.nfc-dot').title =
          data.available ? 'Lecteur NFC connecté' : 'Lecteur NFC absent';
      }
    });

    es.addEventListener('card', function(e) {
      const data = JSON.parse(e.data);
      if (indicator) indicator.className = 'detected';
      if (data.filament) {
        nfcShowOverlay(data.filament);
      }
      // Bobine inconnue → ignorer
    });

    es.addEventListener('card_removed', function() {
      const indicator = document.getElementById('nfc-indicator');
      if (indicator && indicator.className === 'detected') {
        indicator.className = 'connected';
      }
    });

    es.onerror = function() {
      if (indicator) indicator.className = '';
      setTimeout(connect, 5000); // Reconnexion auto
    };
  }

  connect();
}

function nfcShowOverlay(f) {
  _nfcCurrentFilament = f;

  // Remplir la fiche
  const pct    = f.weight_total > 0 ? Math.round(f.weight_remaining / f.weight_total * 100) : 0;
  const barCol = pct < 15 ? 'var(--danger)' : pct < 25 ? 'var(--warning)' : 'var(--success)';

  document.getElementById('nfc-filament-name').textContent = f.name;
  const dot = document.getElementById('nfc-color-dot');
  if (dot) { dot.style.background = f.color_hex || '#ccc'; }

  const body = document.getElementById('nfc-card-body');
  if (body) {
    body.innerHTML =
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +

      row('Marque',    f.brand || '—') +
      row('Matière',   f.material + (f.elegoo_subtype ? ' · ' + f.elegoo_subtype : '')) +
      row('Couleur',   f.color_name ?
        '<span style="display:inline-flex;align-items:center;gap:6px">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:' + (f.color_hex||'#ccc') + ';display:inline-block"></span>' +
        f.color_name + '</span>' : '—') +
      row('Diametre',  (f.diameter || 1.75) + ' mm') +
      row('Stock restant',
        '<span style="font-weight:700;color:' + barCol + '">' + Math.round(f.weight_remaining) + 'g</span>' +
        ' / ' + f.weight_total + 'g (' + pct + '%)') +
      row('Buse',      (f.temp_nozzle_min||'?') + ' - ' + (f.temp_nozzle_max||'?') + ' C') +
      row('Plateau',   (f.temp_bed_min||'?') + ' - ' + (f.temp_bed_max||'?') + ' C') +
      (f.location ? row('Emplacement', f.location) : '') +
      (f.spool_number ? row('N bobine', f.spool_number) : '') +

      '</div>' +

      // Barre de stock
      '<div style="margin-top:14px">' +
        '<div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden">' +
          '<div style="height:100%;width:' + pct + '%;background:' + barCol + ';border-radius:4px;transition:width 0.5s"></div>' +
        '</div>' +
      '</div>';
  }

  // Afficher l'overlay
  const overlay = document.getElementById('nfc-overlay');
  if (overlay) overlay.classList.add('visible');

  // Timer fermeture automatique
  nfcStartAutoClose();
}

function row(label, value) {
  return '<div style="background:var(--bg3);border-radius:var(--radius);padding:10px 12px">' +
    '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:3px">' + label + '</div>' +
    '<div style="font-size:13px;font-weight:500;color:var(--text)">' + value + '</div>' +
  '</div>';
}

function nfcStartAutoClose() {
  if (_nfcAutoCloseTimer) clearTimeout(_nfcAutoCloseTimer);

  const bar       = document.getElementById('nfc-auto-close-bar');
  const countdown = document.getElementById('nfc-countdown');
  const start     = Date.now();

  // Animer la barre
  if (bar) {
    bar.style.transition = 'none';
    bar.style.width      = '100%';
    setTimeout(function() {
      bar.style.transition = 'width ' + (NFC_AUTO_CLOSE_MS / 1000) + 's linear';
      bar.style.width      = '0%';
    }, 50);
  }

  // Compte à rebours
  const tick = setInterval(function() {
    const remaining = Math.max(0, Math.ceil((NFC_AUTO_CLOSE_MS - (Date.now() - start)) / 1000));
    if (countdown) countdown.textContent = remaining;
    if (remaining <= 0) clearInterval(tick);
  }, 500);

  _nfcAutoCloseTimer = setTimeout(function() {
    clearInterval(tick);
    nfcCloseOverlay();
  }, NFC_AUTO_CLOSE_MS);
}

function nfcCloseOverlay() {
  if (_nfcAutoCloseTimer) { clearTimeout(_nfcAutoCloseTimer); _nfcAutoCloseTimer = null; }
  const overlay = document.getElementById('nfc-overlay');
  if (overlay) overlay.classList.remove('visible');
  _nfcCurrentFilament = null;

  // Remettre l'indicateur en connected si lecteur dispo
  const indicator = document.getElementById('nfc-indicator');
  if (indicator && indicator.className === 'detected') indicator.className = 'connected';
}

function nfcGoWeigh() {
  if (!_nfcCurrentFilament) return;
  const f = _nfcCurrentFilament;
  nfcCloseOverlay();
  // Ouvrir le panneau pesée directement sur cette bobine
  document.getElementById('kiosk-panel-title').textContent = 'Pesee rapide';
  document.getElementById('kiosk-panel').style.display = 'flex';
  _weighFilament = f;
  kioskRenderWeighPad();
}

// ── Démarrage ─────────────────────────────────────────────────────────────
initTheme();
initNfcSse();
kioskRefresh(false);
_refreshTimer = setInterval(kioskRefresh, REFRESH_MS);
</script>
